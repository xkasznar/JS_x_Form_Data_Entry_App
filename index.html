<!DOCTYPE html>

						</div>
						<div>
							<label>E-mail<span>*</span></label>
							<input type="email" name="email" id="email" onchange="checkEmail();" pattern = "^[A-Za-z0-9._%+-]{3,}@[a-zA-Z]{1,}([.]{1}[a-zA-Z]{2,4}|[.]{1}[a-zA-Z]{1,}[.]{1}[a-zA-Z]{2,4})$">

						</div>
					</div>
				</div>
				<br>
				<div class ="poz-b">

					<div class = "row">
						<div>
							<select id="selBranch1" onchange="selUpd1();selUpd2();" name="lineList" size="1">
							<option value="0xx">EarthLine </option>
							<option value="1xx">MarsLine</option>
							</select>

							<select id="selBranch2" onchange="selUpd2();" name="heightList" size="1">
							<option value="00x">Low Earth Orbit</option>
							<option value="01x">High Earth Orbit</option>
							</select>

							<select id="selBranch3" name="classList" size="1">
							<option value="000">EL LEO Econ</option>
							<option value="001">EL LEO Bsns</option>
							</select>
						</div>
						<div>
							<label>Boli ste pilotom poučení o bezpečnosti?<span>*</span></label>
							<input onclick="rbShrink();" type="radio" id="rb-optano" name="rb-opt" value="ano">✓
							<input onclick="rbExp();" type="radio" id="rb-optnie" name="rb-opt" value="nie">✗

					</div>
				</div>
				<br>

						</div>
						<div>
							<label>Oznámkujte nás<span>*</span></label>
							<input type="radio" id="rrsA" name="radio-rating" value="A">A
							<input type="radio" id="rrsB" name="radio-rating" value="B">B
							<input type="radio" id="rrsC" name="radio-rating" value="C">C
							<input type="radio" id="rrsD" name="radio-rating" value="D">D
							<input type="radio" id="rrsE" name="radio-rating" value="E">E
							<input type="radio" id="rrsFx" name="radio-rating" value="Fx">Fx
						</div>
					</div>
				</div>
				<br>
				<input type="submit" name ="submit" value="Odovzdať" id="odovzdavac">
